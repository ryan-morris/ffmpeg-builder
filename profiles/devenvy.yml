# The builds devenvy/ffmpeg publishes, as targets: `ffmpeg-build init` starts a folder from them. Each target is one build
# (one platform, one license, one FFmpeg series); bases hold what targets share. `ffmpeg-build show <target>`
# lists what a target gets and where each entry comes from.
bases:
  common:
    with: [openh264, dav1d, openjpeg, jxl, zimg, vmaf, lcms2, vorbis, mp3lame, speex, gsm, soxr, chromaprint,
           xml2, zlib, srt, rist]
  android:
    with: [whisper, aom, vpx, opus, freetype, fribidi, harfbuzz, ass, jni, mediacodec]
  ios:
    with: [whisper, aom, vpx, opus, freetype, fribidi, harfbuzz, ass, securetransport, videotoolbox]
  ios-sim:
    with: [whisper, securetransport, videotoolbox]
  linux:
    with: [v4l2-m2m, whisper, aom, vpx, webp, opus, freetype, fribidi, harfbuzz, fontconfig, ass]
  linux-musl:
    with: [nvenc, vaapi, drm, whisper, aom, svtav1, vpx, webp, opus, freetype, fribidi, harfbuzz, fontconfig,
           ass]
  maccatalyst:
    with: [whisper, aom, vpx, opus, freetype, fribidi, harfbuzz, ass, videotoolbox]
  osx:
    with: [whisper, aom, svtav1, vpx, webp, opus, freetype, fribidi, harfbuzz, fontconfig, ass, audiotoolbox,
           securetransport, videotoolbox]
  win:
    with: [whisper, aom, vpx, webp, opus, freetype, fribidi, harfbuzz, ass, d3d11va, dxva2, mediafoundation,
           schannel]
  gplv3:
    with: [opencore-amrnb, opencore-amrwb, vo-amrwbenc]
  lgplv3:
    with: [opencore-amrnb, opencore-amrwb, vo-amrwbenc]
targets:
