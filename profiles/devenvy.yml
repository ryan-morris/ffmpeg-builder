    platform: android-arm64
    license: gplv2
    ffmpeg: "9"
    base: [common, android]
    with: [gnutls, x264, x265]
  android-arm64-gplv2-ffmpeg8:
    platform: android-arm64
    license: gplv2
    ffmpeg: "8"
    base: [common, android]
