# A consumer's pull-request check (copy into .github/workflows/): builds what the PR changes, publishes nothing.
name: ci
on:
  pull_request:
  workflow_dispatch: # update.yml starts it on its PR's branch (GITHUB_TOKEN's pushes start nothing)

permissions:
  contents: read

jobs:
  build:
    uses: devenvy/ffmpeg-build/.github/workflows/build.yml@v1
    with:
      publish: never
