# A consumer's pull-request check (copy into .github/workflows/): builds what the PR changes, publishes nothing, and
# merges ffmpeg-build's own PRs (update.yml with automerge: true) once the build passes.
name: ci
on:
  pull_request:
  workflow_dispatch: # update.yml starts it on its PR's branch (GITHUB_TOKEN's pushes start nothing)

# contents: write although nothing is published: GitHub refuses to start a run whose called workflow has a job (here
# the skipped release job) asking for more than the caller grants. Pull requests from forks get a read-only token anyway.
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    uses: devenvy/ffmpeg-build/.github/workflows/build.yml@v1
    with:
      publish: never
      # tests: build-runner   # no Windows test runners (a private repository pays twice the Linux rate for them)
  merge:
    needs: build
    uses: devenvy/ffmpeg-build/.github/workflows/automerge.yml@v1
