name: freetype
provides: freetype
license: FTL OR GPL-2.0-or-later
license-files: [LICENSE.TXT, docs/FTL.TXT]
configure: [--enable-libfreetype]
needs: [zlib, libpng]
# gitlab.freedesktop.org returned 502/503/504 on every clone for hours on 2026-09-30/10-01. FreeType's GitHub repo
# is its official mirror and carries every freedesktop tag at identical commits (upstream devenvy #45).
source: { git: https://gitlab.freedesktop.org/freetype/freetype.git, ref: "VER-{version-}", mirror: https://github.com/freetype/freetype.git }
versions: { git-tags: '^VER-(\d+-\d+-\d+)$' }
platforms: all
