# REUSABLE (preview). Keeps a folder's ffmpeg.lock current: runs `ffmpeg-build update`, and opens or refreshes one
# pull request on the `ffmpeg-build/update` branch with the update summary as its body. The caller's own CI (the build
# workflow with `publish: never`) checks the PR; with `automerge: true` it merges itself once that passes.
name: update

on:
  workflow_call:
    inputs:
      folder:
        type: string
        default: .
      automerge:
        type: boolean
        default: false
      engine:
        description: ffmpeg-build version to run (default the one ffmpeg.lock records)
        type: string
        default: ''
    secrets:
      token:
        description: a token whose pushes trigger CI (GITHUB_TOKEN's don't); falls back to GITHUB_TOKEN
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.token || github.token }}
      BRANCH: ffmpeg-build/update
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.token || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: engine
        working-directory: ${{ inputs.folder }}
        env:
          WANTED: ${{ inputs.engine }}
        run: |
          npm install --global "ffmpeg-build@${WANTED:-$(sed -n 's/^engine: *//p' ffmpeg.lock | head -1)}"
      - name: update
        working-directory: ${{ inputs.folder }}
        run: ffmpeg-build update --summary "${RUNNER_TEMP}/pr.md"
      - name: open or refresh the pull request
        env:
          AUTOMERGE: ${{ inputs.automerge }}
          FOLDER: ${{ inputs.folder }}
        run: |
          if git diff --quiet -- "${FOLDER}/ffmpeg.lock"; then
            echo "ffmpeg.lock is current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${BRANCH}"
          git add -- "${FOLDER}/ffmpeg.lock"
          git commit --quiet -m "ffmpeg: update ffmpeg.lock"
          git push --force origin "${BRANCH}"
          title="ffmpeg: update ffmpeg.lock"
          if [ -n "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "${BRANCH}" --title "${title}" --body-file "${RUNNER_TEMP}/pr.md"
          else
            gh pr create --head "${BRANCH}" --title "${title}" --body-file "${RUNNER_TEMP}/pr.md"
          fi
          if [ "${AUTOMERGE}" = "true" ]; then gh pr merge "${BRANCH}" --auto --squash; fi
