major: 8
releases: [8.0.0, 8.0.1, 8.1.0, 8.1.3]
options:
  schannel:        { builtin: true, kind: tls, platforms: [win-*], group: tls }
  securetransport: { builtin: true, kind: tls, platforms: [osx-*, ios-*], group: tls }
  openssl:   { needs: openssl, min: 3.0.0 }
  gnutls:    { needs: gnutls, min: 3.6.0 }
  x265:      { needs: x265, ffmpeg-license: gpl }
  fdk-aac:   { needs: fdk-aac, ffmpeg-license: nonfree }
  dav1d:     { needs: dav1d, min: 0.5.0 }
  nvenc:     { needs: nv-codec, platforms: [linux-*, win-*] }
  whisper:   { needs: whisper.cpp, since: 8.0.0 }
  srt:       { needs: srt, min: 1.3.0 }
  vaapi:     { needs: libva, platforms: [linux-*, android-*] }
  opus:      { needs: opus }
