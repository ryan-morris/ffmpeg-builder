# Daily release train: publishes every variant whose locked inputs changed since its last
# published release. Back-to-back merges cost one release; a failed day is retried the next.
name: Release
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  release:
    uses: devenvy/ffmpeg-build/.github/workflows/build.yml@v1
    with:
      profile: ffmpeg.yml
      publish: changed-only
