# Keeps ffmpeg.lock current. Runs `ffmpeg-build update`, opens or refreshes one PR
# (examples/update-pr.md); CI builds it; it merges itself when green.
name: Update
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

jobs:
  update:
    uses: devenvy/ffmpeg-build/.github/workflows/update.yml@v1
    with:
      profile: ffmpeg.yml
      automerge: true
