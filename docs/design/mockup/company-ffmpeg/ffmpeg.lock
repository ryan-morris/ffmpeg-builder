# ffmpeg.lock - written only by `ffmpeg-build update` / `ffmpeg-build lock`. Do not edit.
# Records EXACTLY what each profile builds with: reproducible builds, and the source bundle can
# name every input. Pairs with the profiles the way Chart.lock pairs with Chart.yaml.
engine: 1.4.2
images:
  linux: ghcr.io/devenvy/ffmpeg-build-linux@sha256:41aa...
  mingw: ghcr.io/devenvy/ffmpeg-build-mingw@sha256:7c03...
  android: ghcr.io/devenvy/ffmpeg-build-android@sha256:e5d1...
  macos: { runner: macos-15, xcode: "16.4" }

profiles:
  dvr:
    ffmpeg: { "9": 9.0.2 }
    libraries:
      nv-codec: 13.0.19.1
      libva: 2.24.1
      libdrm: 2.4.134
      srt: 1.5.7
      mbedtls: 3.6.7            # srt's crypto (needs-one-of), chosen automatically
      dav1d: 1.5.4
      opus: 1.6.1
    patches:
      patches/acme-muxer: sha256:c0ffee...

  playback:
    ffmpeg: { "8": 8.1.3, "9": 9.0.2 }
    libraries:
      openssl: 3.5.7            # tls on linux/android; windows/apple use their native tls
      nv-codec: 13.0.19.1
      whisper.cpp: 1.9.4
      libplacebo: 7.360.1       # win-arm64 uses the pinned 7.349.0 below
      dav1d: 1.5.4
      # ... every library `start: everything` resolves to under `nonfree`, minus `without`
    per-platform:
      win-arm64: { libplacebo: 7.349.0 }
    patches:
      patches/acme-muxer: sha256:c0ffee...
