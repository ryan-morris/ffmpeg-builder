# Build and publish a profile whenever its lock entry, profile or patches change on main.
# (Internal builds release on merge; our OSS distribution uses a daily train instead.)
name: Release
on:
  push:
    branches: [main]
    paths: [ffmpeg.lock, "*.yml", "patches/**", "tests/**"]
  workflow_dispatch:

jobs:
  release:
    strategy:
      matrix:
        profile: [dvr.yml, playback.yml]
    uses: devenvy/ffmpeg-build/.github/workflows/build.yml@v1
    with:
      profile: ${{ matrix.profile }}
      publish: changed-only     # skips a profile whose inputs did not change
