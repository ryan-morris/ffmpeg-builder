# Published with every release under this exact name, so .../releases/latest/download/manifest.yml
# always works. `ffmpeg-build fetch` reads it; scripts can too (yq) instead of guessing asset names.
release: dvr-9.1.0.0
profile: dvr
ffmpeg: 9.1.0
build: 0
license: nonfree
redistributable: false
engine: 1.4.2

variants:
  - platform: linux-arm64
    assets:
      runtime: { name: ffmpeg-9.1.0-linux-arm64-dvr.tar.gz,     sha256: 5e8a... }
      dev:     { name: ffmpeg-9.1.0-linux-arm64-dvr-dev.tar.gz, sha256: 0b17... }
    image: ghcr.io/devenvy/ffmpeg-build-linux@sha256:41aa...
    components:
      nv-codec: 13.0.19.1
      libva: 2.24.1
      srt: 1.5.8
      mbedtls: 3.6.7
      dav1d: 1.5.4
      opus: 1.6.1
    patches: [acme-muxer@sha256:c0ffee...]
    not-included: []

sources: { name: ffmpeg-9.1.0-dvr-sources.tar.gz, sha256: 77d0... }
