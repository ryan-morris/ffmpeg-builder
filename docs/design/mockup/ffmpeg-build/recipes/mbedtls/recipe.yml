name: mbedtls
provides: mbedtls
license: Apache-2.0
configure: []                     # never FFmpeg's TLS here; used by srt / librist for their encryption

source:
  url: https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-{version}/mbedtls-{version}.tar.bz2
versions:
  git-tags: '^v(3\.\d+\.\d+)$'    # 4.x drops ctr_drbg/entropy; srt and librist not yet ported

platforms: all
