name: nv-codec
provides: nvenc
license: MIT
configure: [--enable-ffnvcodec, --enable-nvenc, --enable-nvdec, --enable-cuvid]

source:
  git: https://github.com/FFmpeg/nv-codec-headers
  ref: "n{version}"

versions:
  git-tags: '^n(\d+\.\d+\.\d+\.\d+)$'   # four-part, compared numerically

# Shown next to each version by `outdated` and in update PRs: it decides who can run the result.
notes:
  "13.1": needs NVIDIA driver 610+
  "13.0": needs NVIDIA driver 570+
  "12.2": needs NVIDIA driver 550+ (Linux) / 551.76+ (Windows)

platforms: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, win-x64]
