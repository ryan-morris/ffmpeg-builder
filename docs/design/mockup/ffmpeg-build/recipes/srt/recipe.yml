name: srt
provides: srt
license: MPL-2.0
configure: [--enable-libsrt]

# SRT needs a crypto library for encryption. It uses whichever of these the build already has,
# in this order, and adds mbedtls if none is present and the license allows it. Without any,
# SRT is built without encryption and `plan` says so.
needs-one-of: [gnutls, mbedtls, openssl]

source:
  git: https://github.com/Haivision/srt
  ref: "v{version}"
versions:
  git-tags: '^v(\d+\.\d+\.\d+)$'

platforms: all
