name: gnutls
provides: gnutls
license: LGPL-2.1-or-later        # fits every license, so it is the TLS for v2 builds on Linux/Android
configure: [--enable-gnutls]
needs: [gmp, nettle, libtasn1]    # built first, from their own recipes

group: tls
prefer: 3                         # after openssl: chosen where openssl is not allowed (v2 licenses)

source:
  url: https://www.gnupg.org/ftp/gcrypt/gnutls/v{major}.{minor}/gnutls-{version}.tar.xz
versions:
  listing: https://www.gnupg.org/ftp/gcrypt/gnutls/
  files: 'gnutls-(\d+\.\d+\.\d+)\.tar\.xz'

platforms: [linux-*, android-*]
