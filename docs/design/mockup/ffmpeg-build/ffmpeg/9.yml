# GENERATED by .github/workflows/ffmpeg-support.yml from the configure script of every FFmpeg 9.x
# release. Never edited by hand. The CLI uses it to turn start / with / without into configure
# flags, and `check` uses it to say what each version offers.
major: 9
releases: [9.0.0, 9.0.1, 9.0.2, 9.0.3, 9.1.0]

options:
  # builtin: part of FFmpeg itself - included by `start: everything`, nothing to build
  whep:           { builtin: true, kind: muxer, since: 9.1.0 }
  scale_d3d12:    { builtin: true, kind: filter, platforms: [win-*] }
  schannel:       { builtin: true, kind: tls, platforms: [win-*], group: tls, prefer: 1 }
  securetransport: { builtin: true, kind: tls, platforms: [osx-*, ios-*, maccatalyst-*], group: tls, prefer: 1 }

  # needs: a library - built from recipes/<name>/; min comes straight from configure
  openssl:     { needs: openssl, min: 3.0.0 }
  gnutls:      { needs: gnutls, min: 3.6.0 }
  x265:        { needs: x265, ffmpeg-license: gpl }        # from configure: EXTERNAL_LIBRARY_GPL_LIST
  fdk-aac:     { needs: fdk-aac, ffmpeg-license: nonfree } # NONFREE list: only `license: nonfree`
  dav1d:       { needs: dav1d, min: 1.0.0 }
  nvenc:       { needs: nv-codec, min: 12.1.14.0 }
  libplacebo:  { needs: libplacebo, min: 7.351.0 }
  whisper:     { needs: whisper.cpp, min: 1.7.5 }
  srt:         { needs: srt, min: 1.3.0 }
  # ... every option configure offers
