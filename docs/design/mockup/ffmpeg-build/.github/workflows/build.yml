# REUSABLE. Consumers call this to build and publish a profile:
#   check -> plan (becomes the job matrix) -> build per platform -> test -> bundle -> release
# Apple platforms run on macos runners; everything else in the pinned toolchain images.
name: build
on:
  workflow_call:
    inputs:
      profile:  { type: string, required: true }
      publish:  { type: string, default: changed-only }   # changed-only | always | never
    secrets:
      token:    { required: false }   # only for private patch/extension repos

jobs:
  plan:     { runs-on: ubuntu-latest, steps: [{ run: "ffmpeg-build check && ffmpeg-build plan --format matrix" }] }
  build:    { needs: plan, strategy: { matrix: "${{ fromJson(needs.plan.outputs.matrix) }}" }, runs-on: "${{ matrix.runner }}", steps: [{ run: "ffmpeg-build build --platform ${{ matrix.platform }} && ffmpeg-build test --platform ${{ matrix.platform }}" }] }
  release:  { needs: build, runs-on: ubuntu-latest, steps: [{ run: "ffmpeg-build bundle && publish (tag, assets, SHA256SUMS, manifest.yml, sources, release notes)" }] }
